<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review – WDD 131</title>
    <meta name="description" content="Product review form for submitting feedback on various technical products and gadgets.">
    <meta name="author" content="Clive Musika">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">
        
            <fieldset>
                <legend>Product Information</legend>
                <div class="form-item">
                    <label for="productName">Product Name <span class="required">*</span></label>
                    <select id="productName" name="product" required>
                        <option value="" disabled selected>Select a Product ...</option>
                    </select>
                </div>
            </fieldset>

           
            <fieldset>
                <legend>Overall Rating <span class="required">*</span></legend>
                <div class="rating-group">
                    <label for="rating1"><input type="radio" id="rating1" name="rating" value="1" required> ☆</label>
                    <label for="rating2"><input type="radio" id="rating2" name="rating" value="2" required> ☆☆</label>
                    <label for="rating3"><input type="radio" id="rating3" name="rating" value="3" required> ☆☆☆</label>
                    <label for="rating4"><input type="radio" id="rating4" name="rating" value="4" required> ☆☆☆☆</label>
                    <label for="rating5"><input type="radio" id="rating5" name="rating" value="5" required> ☆☆☆☆☆</label>
                </div>
            </fieldset>

            
            <fieldset>
                <legend>Installation Details</legend>
                <div class="form-item">
                    <label for="installDate">Date of Installation <span class="required">*</span></label>
                    <input type="date" id="installDate" name="installDate" required>
                </div>
            </fieldset>

           
            <fieldset>
                <legend>Useful Features (Check all that apply)</legend>
                <div class="checkbox-group">
                    <label for="feature1"><input type="checkbox" id="feature1" name="features" value="durability"> Durability</label>
                    <label for="feature2"><input type="checkbox" id="feature2" name="features" value="ease"> Ease of Use</label>
                    <label for="feature3"><input type="checkbox" id="feature3" name="features" value="performance"> Performance</label>
                    <label for="feature4"><input type="checkbox" id="feature4" name="features" value="design"> Design</label>
                </div>
            </fieldset>

          
            <fieldset>
                <legend>Your Feedback</legend>
                <div class="form-item">
                    <label for="reviewText">Written Review (Optional)</label>
                    <textarea id="reviewText" name="review" rows="4"></textarea>
                </div>
                <div class="form-item">
                    <label for="userName">Your Name (Optional)</label>
                    <input type="text" id="userName" name="userName">
                </div>
            </fieldset>

            <!-- Submit Button -->
            <div class="form-submit">
                <input type="submit" value="Post Review">
            </div>
        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> | Clive Musika| South Africa</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
