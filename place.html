<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 - Cape Town Page</title>
    <link rel="stylesheet" href="styles/place.css">
    <script src="scripts/place.js" defer></script>
</head>
<body>
    <header><h1>Cape Town, South Africa</h1></header>
    <main>
        <div class="hero">
            <picture>
                <source srcset="images/capetown-large.webp" media="(min-width: 1000px)">
                <source srcset="images/capetown-medium.webp" media="(min-width: 500px)">
                <img src="images/capetown-small.webp" alt="Cape Town landscape" width="1500" height="750">
            </picture>
        </div>
        <section id="weather">
            <h2>Weather</h2>
            <p>Temperature: 15°C</p>
            <p>Wind Speed: 10 km/h</p>
            <p id="windChill">Wind Chill: N/A</p>
        </section>
    </main>
    <footer>
        <p>&copy; <span id="year"></span> | Clive | Last Modified: <span id="lastModified"></span></p>
    </footer>
</body>
</html>
